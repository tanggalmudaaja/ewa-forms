<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Anggota Earned Wage Access (EWA)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-indigo-50 to-slate-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
        <!-- Header Banner with Logo on Left and Centered Title -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-6 py-8 text-white relative flex items-center">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=60" alt="Logo" class="w-14 h-14 rounded-xl object-cover border-2 border-white/30 shadow-md flex-shrink-0">
            <div class="text-center flex-grow px-4">
                <span class="bg-blue-500/30 text-blue-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Fasilitas Keuangan Karyawan</span>
                <h1 class="text-xl sm:text-2xl font-bold mt-1">Pendaftaran Akun EWA</h1>
                <p class="text-blue-100 text-xs sm:text-sm mt-0.5">Nikmati akses gaji fleksibel sebelum tanggal penggajian tiba.</p>
            </div>
        </div>

        <div class="p-6 sm:p-8">
            <form id="ewaForm" class="space-y-6">
                <div class="border-b border-slate-200 pb-6">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4">Informasi Pribadi & Identitas KTP</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label><input type="text" id="fullName" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-sm"></div>
                        <div><label class="block text-sm font-medium text-slate-700 mb-1">NIK Karyawan</label><input type="text" id="employeeId" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-sm"></div>
                    </div>
                    <div class="mt-4"><label class="block text-sm font-medium text-slate-700 mb-1">NIK KTP (16 Digit)</label><input type="text" id="ktpNumber" required maxlength="16" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-slate-50 text-sm"></div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl shadow-md transition text-sm cursor-pointer">Kirim Pendaftaran</button>
            </form>
        </div>
    </div>
</body>
</html>
