<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran & Manajemen Personil Marketing - PT. Dana Solusi Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-slate-50 to-indigo-100 min-h-screen py-10 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto space-y-6">
        
        <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-800 rounded-2xl shadow-xl p-6 text-white flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <img id="appLogo" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=60" alt="Logo" class="w-12 h-12 rounded-xl object-cover border-2 border-white/30 shadow" onerror="this.src='https://placehold.co/100x100/4f46e5/ffffff?text=Logo'">
                <div>
                    <span class="bg-white/20 text-blue-100 text-[10px] font-semibold px-2.5 py-0.5 rounded-full uppercase tracking-wider">ADMIN PT. DANA SOLUSI DIGITAL</span>
                    <h1 class="text-xl font-bold mt-0.5">Pendaftaran Tim & Agency Marketing</h1>
                </div>
            </div>
            <a href="partner_registration.html" class="bg-white/20 hover:bg-white/30 text-white text-xs font-medium px-3 py-2 rounded-xl transition">&larr; Kembali ke Mitra</a>
        </div>

        <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8 border border-slate-200">
            <div class="border-b border-slate-200 pb-4 mb-6">
                <h2 class="text-base font-bold text-slate-800">Formulir Pendaftaran Personil / Agency Marketing</h2>
                <p class="text-xs text-slate-500 mt-0.5">Lengkapi seluruh informasi data diri, legalitas KTP, serta rekening bank pencairan komisi.</p>
            </div>

            <form id="marketingForm" class="space-y-5">
                <!-- Baris 1: ID & Kategori -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">ID Marketing <span class="text-rose-500">*</span></label>
                        <input type="text" id="mId" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 uppercase focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="MKT-001">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Kategori Peran <span class="text-rose-500">*</span></label>
                        <select id="mCategory" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Pilih Kategori Peran</option>
                            <option value="Marketing Agency Partner">Marketing Agency Partner</option>
                            <option value="Marketing Non-Agency">Marketing Non-Agency</option>
                            <option value="Referral Partner">Referral Partner</option>
                        </select>
                    </div>
                </div>

                <!-- Baris 2: Nama Lengkap / Agency -->
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Nama Lengkap / Agency <span class="text-rose-500">*</span></label>
                    <input type="text" id="mName" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan nama personil atau nama PT/CV Agency">
                </div>

                <!-- Baris 3: WhatsApp & HP Lain -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Nomor WhatsApp Aktif <span class="text-rose-500">*</span></label>
                        <input type="tel" id="mWa" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="08xxxxxxxxxx">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">Nomor HP / Telepon Lain <span class="text-rose-500">*</span></label>
                        <input type="tel" id="mPhone" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="08xxxxxxxxxx">
                    </div>
                </div>

                <!-- Baris 4: NIK KTP -->
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">NIK KTP (16 Digit) <span class="text-rose-500">*</span></label>
                    <input type="text" id="mKtp" required maxlength="16" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan 16 digit nomor KTP">
                </div>

                <!-- Baris 5: Alamat Domisili -->
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Alamat Domisili Lengkap <span class="text-rose-500">*</span></label>
                    <textarea id="mAddress" rows="2.5" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Alamat lengkap sesuai KTP..."></textarea>
                </div>

                <!-- Baris 6: Rekening Bank -->
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Informasi Rekening Bank Pencairan Komisi <span class="text-rose-500">*</span></label>
                    <input type="text" id="mBank" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Contoh: BCA 1234567890 a.n Nama Pemilik Rekening">
                </div>

                <!-- Baris 7: Unggah Foto KTP & Kamera -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <label class="block text-xs font-medium text-slate-700">Foto KTP Pendaftar Marketing <span class="text-rose-500">*</span></label>
                    <div class="flex flex-col sm:flex-row items-center gap-2">
                        <label class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl text-xs cursor-pointer transition shadow-sm flex items-center justify-center">
                            <span>📁 Pilih File KTP</span>
                            <input type="file" id="mKtpFile" accept="image/*" onchange="encodeKtpImage(this)" class="hidden">
                        </label>
                        <button type="button" onclick="openCameraModal()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl text-xs cursor-pointer transition shadow-sm flex items-center justify-center">
                            <span>📸 Ambil Foto Kamera</span>
                        </button>
                    </div>
                    <input type="hidden" id="mKtpPhotoBase64">
                    <div id="ktpPreviewStatus" class="text-xs text-emerald-600 font-medium"></div>
                </div>

                <!-- Tombol Submit -->
                <div class="pt-2">
                    <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl text-sm transition shadow-md cursor-pointer">Simpan & Daftarkan Marketing</button>
                </div>
            </form>
            <div id="alertBox" class="hidden mt-4 p-4 rounded-xl text-sm"></div>
        </div>
    </div>

    <div id="cameraModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 text-center">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h3 class="text-base font-bold text-slate-800">Ambil Foto KTP Marketing</h3>
                <button type="button" onclick="closeCameraModal()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer font-bold">✕</button>
            </div>
            <div class="relative bg-black rounded-xl overflow-hidden aspect-[4/3] flex items-center justify-center">
                <video id="cameraVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="cameraCanvas" class="hidden"></canvas>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button type="button" onclick="closeCameraModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 px-4 rounded-xl transition text-sm cursor-pointer">Batal</button>
                <button type="button" onclick="captureCameraPhoto()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm shadow-sm cursor-pointer">📸 Tangkap Foto</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                let scriptURL = localStorage.getItem('ewa_script_url') || '';
                if (scriptURL) {
                    const res = await fetch(scriptURL + '?getConfig=true');
                    const data = await res.json();
                    if (data && data.logoUrl) {
                        document.getElementById('appLogo').src = data.logoUrl;
                    }
                }
            } catch (e) {}
        });

        function encodeKtpImage(element) {
            const file = element.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onloadend = function () {
                document.getElementById('mKtpPhotoBase64').value = reader.result;
                document.getElementById('ktpPreviewStatus').textContent = '✓ Foto KTP berhasil dimuat (' + file.name + ')';
            }
            reader.readAsDataURL(file);
        }

        let mediaStream = null;
        async function openCameraModal() {
            document.getElementById('cameraModal').classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
                document.getElementById('cameraVideo').srcObject = mediaStream;
            } catch (err) {
                alert('Tidak dapat mengakses kamera.');
                closeCameraModal();
            }
        }

        function closeCameraModal() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('cameraModal').classList.add('hidden');
        }

        function captureCameraPhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('cameraCanvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const dataURL = canvas.toDataURL('image/jpeg', 0.85);
            document.getElementById('mKtpPhotoBase64').value = dataURL;
            document.getElementById('ktpPreviewStatus').textContent = '✓ Foto KTP kamera berhasil diambil';
            closeCameraModal();
        }

        document.getElementById('marketingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const alertBox = document.getElementById('alertBox');
            btn.textContent = 'Menyimpan Data...';

            const newM = {
                mId: document.getElementById('mId').value.toUpperCase(),
                mName: document.getElementById('mName').value,
                mCategory: document.getElementById('mCategory').value,
                mWa: document.getElementById('mWa').value,
                mPhone: document.getElementById('mPhone').value,
                mKtp: document.getElementById('mKtp').value,
                mAddress: document.getElementById('mAddress').value,
                mBank: document.getElementById('mBank').value,
                mKtpPhotoBase64: document.getElementById('mKtpPhotoBase64').value
            };

            try {
                let scriptURL = localStorage.getItem('ewa_script_url') || '';
                if (scriptURL) {
                    await fetch(scriptURL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newM)
                    });
                }
                alertBox.textContent = 'Data personil / agency marketing berhasil disimpan! Mengarahkan kembali ke form Mitra...';
                alertBox.className = 'mt-4 p-4 rounded-xl text-sm bg-emerald-50 text-emerald-800 border border-emerald-200';
                this.reset();
                document.getElementById('ktpPreviewStatus').textContent = '';
                
                setTimeout(() => {
                    window.location.href = 'partner_registration.html';
                }, 1500);
            } catch (err) {
                alertBox.textContent = 'Gagal menyimpan data ke server.';
                alertBox.className = 'mt-4 p-4 rounded-xl text-sm bg-rose-50 text-rose-800 border border-rose-200';
            } finally {
                btn.textContent = 'Simpan & Daftarkan Marketing';
            }
        });
    </script>
</body>
</html>
